default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: commit-msg-prefix
        name: Check commit message prefix
        entry: bin/check-commit-msg.sh
        language: system
        pass_filenames: true
        stages: [commit-msg]

      - id: make-format
        name: Run formatting (make format)
        entry: make format
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: mypy
        name: Type check (mypy)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
